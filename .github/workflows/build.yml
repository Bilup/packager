name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm run build
    - name: Test
      run: pnpm test
    - name: Build standalone
      run: pnpm run build-standalone-prod
    - name: Upload standalone artifact
      uses: actions/upload-artifact@v4
      with:
        name: standalone
        path: dist/standalone.html

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: standalone
    - name: Deploy to web branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git rm -rf . --ignore-unmatch 2>/dev/null || true
        mv standalone.html index.html
        git add index.html
        git commit -m "Deploy from main@${{ github.sha }}"
        git push origin HEAD:web --force